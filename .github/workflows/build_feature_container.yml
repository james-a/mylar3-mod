# Build a LSIO-compatible container for this fork and push to GHCR.
#
# Image tags (same scheme as komga-mod):
#   ghcr.io/<owner>/mylar3:latest
#   ghcr.io/<owner>/mylar3:<mylarVersion>-mod.<forkBuild>
# Package name matches upstream product (komga-mod pattern); GitHub repo stays mylar3-mod.
# where <mylarVersion> is in fork.version and <forkBuild> is the integer in fork.build.
# Bump fork.build when publishing another image for the same upstream version; reset fork.build
# to 1 and update fork.version after merging a new upstream Mylar3 release.

name: Build & Publish Feature Container

on:
    push:
        branches-ignore:
            - 'stable'
            - 'nightly'

concurrency:
    group: bpfc-${{ github.ref }}
    cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mylar3

jobs:
    push_to_registry:
        if: ${{ github.repository != 'MylarComics/mylar3' }}
        name: Build Docker image and push to GHCR
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
          attestations: write
          id-token: write
        steps:
          - name: Checkout fork (version files)
            uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
            with:
              path: fork-src

          - name: Set image tags
            id: ver
            run: |
              VER=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' fork-src/fork.version | head -n1)
              FORK_BUILD=$(grep -E '^[0-9]+$' fork-src/fork.build | head -n1)
              if [ -z "$VER" ] || [ -z "$FORK_BUILD" ]; then
                echo "Could not read fork.version or fork.build" >&2
                exit 1
              fi
              TAG="${VER}-mod.${FORK_BUILD}"
              echo "version=$VER" >> "$GITHUB_OUTPUT"
              echo "fork_build=$FORK_BUILD" >> "$GITHUB_OUTPUT"
              echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
              echo "Building Mylar3 $VER (fork image tag: $TAG)"

          - name: Checkout LSIO mylar3 repository (nightly)
            uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
            with:
              repository: 'linuxserver/docker-mylar3'
              ref: 'nightly'
              path: docker-mylar3

          - name: Edit Dockerfile for current repo/branch
            working-directory: docker-mylar3
            run: |
              sed -i "/ARG MYLAR3_RELEASE/aENV PYDEVD_DISABLE_FILE_VALIDATION=1" Dockerfile
              # LSIO nightly Dockerfile defaults to MylarComics/mylar3 @ commits/nightly.
              # Rewrite repo + ref to this fork branch so the tarball matches the workflow trigger.
              sed -i "s@MylarComics/mylar3@${{ github.repository }}@g" Dockerfile
              sed -i "s@commits/nightly@commits/${{ github.ref_name }}@g" Dockerfile
              # Legacy LSIO branches (unstable / 1000papercuts) — no-ops on current nightly.
              sed -i "s@mylar3/mylar3@${{ github.repository }}@g" Dockerfile
              sed -i "s@1000papercuts@${{ github.ref_name }}@g" Dockerfile
              sed -i "/requirements.txt/a\ \ pip install --no-cache-dir --find-links https://wheel-index.linuxserver.io/alpine-3.23/ debugpy && \\\\" Dockerfile
              sed -i "/EXPOSE 8090/aEXPOSE 5678" Dockerfile
              sed -i "s@python3 /app/mylar3/Mylar.py@python3 -m debugpy --listen 0.0.0.0:5678 /app/mylar3/Mylar.py@g" ./root/etc/s6-overlay/s6-rc.d/svc-mylar3/run

          - name: Log in to the Container registry
            uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
            with:
              registry: ${{ env.REGISTRY }}
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Build and push Docker image
            id: push
            uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
            with:
              context: docker-mylar3
              push: true
              tags: |
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.image_tag }}
              labels: |
                org.opencontainers.image.source=${{ github.repositoryUrl }}
                org.opencontainers.image.revision=${{ github.sha }}
                org.opencontainers.image.version=${{ steps.ver.outputs.image_tag }}

          - name: Cleanup old untagged GHCR images
            uses: dataaxiom/ghcr-cleanup-action@cd0cdb900b5dbf3a6f2cc869f0dbb0b8211f50c4 # v1.0.16
            with:
              keep-n-untagged: 5
